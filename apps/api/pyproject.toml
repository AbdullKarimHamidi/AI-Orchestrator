[project]
name = "orchestrator-api"
version = "0.1.0"
description = "FastAPI control plane and worker for the AI orchestration platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pymongo==4.19.0",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
  "jsonschema==4.26.0",
  "numpy==2.5.4",
  "pypdf==6.21.3",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "mypy==2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "S105", "S106", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
