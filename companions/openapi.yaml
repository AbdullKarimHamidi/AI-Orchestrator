    WorkflowDefinition:
      title: WorkflowDefinition
      type: object
      required:
      - meta
      - graph
      additionalProperties: false
      properties:
        meta:
          type: object
          required:
          - name
          - workspace_id
          - version
          additionalProperties: false
          properties:
            name:
              type: string
            description:
              type: string
            workspace_id:
              type: string
            version:
              type: integer
              minimum: 1
        graph:
          type: object
          required:
          - nodes
          - edges
          - budget
          - policies
          additionalProperties: false
          properties:
            nodes:
              type: array
              minItems: 1
              items:
                oneOf:
                - $ref: '#/components/schemas/NodeStart'
                - $ref: '#/components/schemas/NodeEnd'
                - $ref: '#/components/schemas/NodeAgent'
                - $ref: '#/components/schemas/NodeModelInvoke'
                - $ref: '#/components/schemas/NodeTool'
                - $ref: '#/components/schemas/NodeCondition'
                - $ref: '#/components/schemas/NodeParallel'
                - $ref: '#/components/schemas/NodeJoin'
                - $ref: '#/components/schemas/NodeLoop'
                - $ref: '#/components/schemas/NodeTransform'
                - $ref: '#/components/schemas/NodeApproval'
                - $ref: '#/components/schemas/NodeDelay'
                - $ref: '#/components/schemas/NodeTriggerSchedule'
                - $ref: '#/components/schemas/NodeTriggerEvent'
                - $ref: '#/components/schemas/NodeSubWorkflow'
                - $ref: '#/components/schemas/NodeErrorHandler'
                - $ref: '#/components/schemas/NodeHumanInput'
            edges:
              type: array
              items:
                type: object
                required:
                - from
                - to
                additionalProperties: false
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  condition:
                    type: string
                    description: JSON-Logic expression over graph state, serialized as a JSON string;
                      absent or the literal 'default' = unconditional
                  kind:
                    type: string
                    enum:
                    - normal
                    - error
                    - approval_result
                    default: normal
            budget:
              type: object
              required:
              - limits
              additionalProperties: false
              properties:
                limits:
                  type: object
                  required:
                  - run_usd_max
                  - run_tokens_max
                  - run_seconds_max
                  additionalProperties: false
                  properties:
                    run_usd_max:
                      type: number
                      minimum: 0
                    run_tokens_max:
                      type: integer
                      minimum: 1
                    run_seconds_max:
                      type: integer
                      minimum: 1
            policies:
              type: object
              additionalProperties: false
              properties:
                on_node_error:
                  type: string
                  enum:
                  - halt
                  - continue
                  default: halt
                approval:
                  type: object
                  additionalProperties: true
                data_retention_days:
                  type: integer
                  minimum: 1
                  default: 30
    NodeStart:
      type: object
      required:
      - id
      - type
      - workspace_id
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: start
        next:
          type: string
    NodeEnd:
      type: object
