      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: model_invoke
        model_alias:
          type: string
        prompt_template:
          type: string
          description: Sandboxed Jinja template
        output_schema_ref:
          type: string
        max_tokens:
          type: integer
          minimum: 1
        next:
          type: string
    NodeTool:
      type: object
      required:
      - id
      - type
      - workspace_id
      - tool
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: tool
        tool:
          type: object
          required:
          - ref
          - version
          additionalProperties: false
          properties:
            ref:
              type: string
              description: tool ref, e.g. org/web_search
            version:
              type: integer
              minimum: 1
            config:
              type: object
              description: Per-call config validated against the tool's config schema
        input_mapping:
          type: object
        timeout_seconds:
          type: integer
          minimum: 1
        retry:
          type: object
          required:
          - max_attempts
          - backoff
          additionalProperties: false
          description: Auto-retries permitted only when the registry marks the tool idempotent.
          properties:
            max_attempts:
              type: integer
              minimum: 1
              maximum: 5
            backoff:
              type: string
              enum:
              - fixed
              - exponential
            idempotency_key_expr:
              type: string
              description: 'Optional: expression producing a dedupe key when pre-call state allows'
        next:
          type: string
    NodeCondition:
      type: object
      required:
      - id
      - type
      - workspace_id
      - branches
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: condition
        branches:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - condition
            - next
            additionalProperties: false
            properties:
              condition:
                type: string
                description: JSON-Logic expression over graph state, serialized as a JSON string; 'default'
                  = fallback branch
              next:
                type: string
    NodeParallel:
      type: object
      required:
      - id
      - type
      - workspace_id
      - branches
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: parallel
        branches:
          type: array
          minItems: 2
          items:
            type: object
            required:
            - next
            additionalProperties: false
            properties:
              next:
                type: string
    NodeJoin:
      type: object
      required:
      - id
      - type
      - workspace_id
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: join
        strategy:
          type: string
          enum:
          - all
          - first
          - quorum
          default: all
        quorum:
          type: integer
          minimum: 1
        timeout_seconds:
          type: integer
          minimum: 1
    NodeLoop:
      type: object
      required:
      - id
      - type
      - workspace_id
      - body_start
      - max_iterations
      - on_exhaustion
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: loop
        body_start:
          type: string
        break_condition:
          type: string
          description: JSON-Logic expression over graph state, serialized as a JSON string; evaluated
            after each iteration
        max_iterations:
          type: integer
          minimum: 1
          maximum: 100
        on_exhaustion:
          type: string
          enum:
          - fail
          - proceed
          default: fail
          description: Policy when iterations are exhausted without the break condition. fail (default)
            terminates the run as failed via a failure terminal; proceed requires explicit opt-in.
        iterate_over:
          type: string
    NodeTransform:
      type: object
      required:
      - id
      - type
      - workspace_id
      - expression
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: transform
        expression:
          type: string
        next:
          type: string
    NodeApproval:
      type: object
      required:
      - id
      - type
      - workspace_id
      - policy
      - on_failure
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: approval
        policy:
          type: object
          additionalProperties: true
        timeout_seconds:
          type: integer
          minimum: 1
        on_failure:
          type: string
          description: Edge to follow on expiry/rejection; must terminate at a failure-outcome end node.
    NodeDelay:
      type: object
      required:
      - id
      - type
      - workspace_id
      - duration
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: delay
        duration:
          type: string
        next:
          type: string
    NodeTriggerSchedule:
      type: object
      required:
      - id
      - type
      - workspace_id
      - cron
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: trigger_schedule
        cron:
          type: string
        next:
          type: string
    NodeTriggerEvent:
      type: object
      required:
      - id
      - type
      - workspace_id
      - event_type
      - filter
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: trigger_event
        event_type:
          type: string
        filter:
          type: object
        next:
          type: string
    NodeSubWorkflow:
      type: object
      required:
      - id
      - type
      - workspace_id
      - workflow
      - next
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: subworkflow
        workflow:
          type: object
          required:
          - ref
          - version
          additionalProperties: false
          properties:
            ref:
              type: string
            version:
              type: integer
              minimum: 1
        inputs:
          type: object
        next:
          type: string
    NodeErrorHandler:
      type: object
      required:
      - id
      - type
      - workspace_id
      - strategy
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: error_handler
        strategy:
          type: object
          required:
          - compensation
          additionalProperties: false
          properties:
            compensation:
              type: string
              description: Named compensation strategy from the registry
            notify:
              type: array
              items:
                type: string
            retry_policy:
              type: object
              additionalProperties: true
        next:
          type: string
          description: Must reference a failure-outcome end node.
    NodeHumanInput:
      type: object
      required:
      - id
      - type
      - workspace_id
      - prompt
      - timeout_seconds
      - on_timeout
      additionalProperties: false
      properties:
        id:
          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: human_input
        prompt:
          type: string
        schema_ref:
          type: string
        timeout_seconds:
          type: integer
          minimum: 1
        on_timeout:
          type: string
          enum:
          - fail
          - use_default
          default: fail
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Idempotency / concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Semantically invalid (BUDGET_EXCEEDED, MODEL_CAPABILITY_MISMATCH, APPROVAL_STALE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limited (Retry-After header)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
