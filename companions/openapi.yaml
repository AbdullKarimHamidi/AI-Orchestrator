          type: string
          description: Node id, unique in the graph (kebab-case)
        title:
          type: string
        workspace_id:
          type: string
        type:
          const: end
        outcome:
          type: string
          enum:
          - success
          - failure
          default: success
          description: Terminal outcome. required_outputs are asserted only on success terminals; failure
            terminals are exempt and end the run as failed.
        required_outputs:
          type: array
          items:
            type: string
          description: JSON-Path references into graph state; validated on success terminals only.
