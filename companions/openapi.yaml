components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
    bearerToken:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              examples:
              - VALIDATION_FAILED
              - BUDGET_EXCEEDED
              - MODEL_CAPABILITY_MISMATCH
              - APPROVAL_STALE
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            correlation_id:
              type: string
    Envelope:
      type: object
      required:
      - data
      properties:
        data: {}
        meta:
          type: object
          properties:
            next_cursor:
              type:
              - string
              - 'null'
    RunStatus:
      type: string
      enum:
      - queued
      - running
      - waiting_approval
      - waiting_review
      - retrying
      - completed
      - failed
      - cancelled
      - timed_out
    StartRunRequest:
      type: object
      required:
      - workflow_id
      - workflow_version
      - input
      properties:
        workflow_id:
          type: string
        workflow_version:
          type: integer
        input:
          type: object
          additionalProperties: true
    Run:
      type: object
      required:
      - id
      - workflow_id
      - status
      properties:
        id:
          type: string
        workspace_id:
          type: string
        workflow_id:
          type: string
        workflow_version:
          type: integer
        status:
          $ref: '#/components/schemas/RunStatus'
        trigger:
          type: object
          properties:
            type:
              enum:
              - manual
              - api
              - schedule
              - webhook
              - replay
            user_id:
              type: string
        cost:
          type: object
          properties:
            estimated_usd:
              type: number
            reported_usd:
              type:
              - number
              - 'null'
            reconciled_usd:
              type:
              - number
              - 'null'
        tokens:
          type: object
          properties:
            input:
              type: integer
            output:
              type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        retry_of:
          type:
          - string
          - 'null'
    Approval:
      type: object
      required:
      - id
      - run_id
      - status
      properties:
        id:
          type: string
        run_id:
          type: string
        node_id:
          type: string
        action:
          type: string
        tool_version:
          type: integer
        args_hash:
          type: string
        risk_class:
          enum:
          - low
          - medium
          - high
          - critical
        status:
          enum:
          - pending
          - approved
          - rejected
          - expired
          - stale
        expires_at:
          type: string
          format: date-time
        delivery:
          enum:
          - decision_recorded
          - delivered
          - workflow_resumed
    AgentConfig:
      type: object
      required:
      - key
      - name
      - instructions
      - model
      properties:
        key:
          type: string
          pattern: ^[a-z0-9-]+$
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        model:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            parameters:
              type: object
              additionalProperties: true
            fallbacks:
              type: array
              items:
                type: string
        tools:
          type: array
          items:
            type: object
        limits:
          type: object
          properties:
            max_duration_s:
              type: integer
            max_tool_calls:
              type: integer
            max_tokens:
              type: integer
            max_cost_usd:
              type: number
            max_retries:
              type: integer
            concurrency:
              type: integer
    WorkflowDef:
      $ref: '#/components/schemas/WorkflowDefinition'
    ToolDef:
      type: object
      required:
      - key
      - kind
      - input_schema
      - output_schema
      - risk_class
      - environment
      properties:
        key:
          type: string
        name:
          type: string
        kind:
          enum:
          - builtin
          - integration
          - mcp
          - custom
        input_schema:
          type: object
        output_schema:
          type: object
        auth:
          type: object
        scopes:
          type: array
          items:
            type: string
        timeout_s:
          type: integer
        retry:
          type: object
        environment:
          enum:
          - api
          - sandbox
          - mcp
        risk_class:
          enum:
          - low
          - medium
          - high
          - critical
        idempotent:
          type: boolean
          description: Derived from tool contract, not user-asserted
        approval_policy:
          enum:
          - never
          - on_high_risk
          - always
    ModelEntry:
      type: object
      required:
      - provider_id
      - model_id
      - capabilities
      - status
      properties:
        provider_id:
          type: string
        model_id:
          type: string
        capabilities:
          type: object
          properties:
            chat:
              type: boolean
            streaming:
              type: boolean
            tools:
              type: boolean
            structured_output:
              type: boolean
            vision:
              type: boolean
            embeddings:
              type: boolean
            prompt_caching:
              type: boolean
            usage_reporting:
              enum:
              - none
              - tokens
              - detailed
          context_window:
            type: integer
          max_output_tokens:
            type: integer
          pricing:
            type: object
            properties:
              input_per_mtok_usd:
                type: number
              output_per_mtok_usd:
                type: number
          status:
            enum:
            - active
            - deprecated
            - hidden
    EvalSubject:
      type: object
      properties:
        kind:
          enum:
          - agent_version
          - model_alias
          - prompt
        ref:
          type: string
    BudgetPolicy:
      type: object
      required:
      - scope
      - limits
      properties:
        scope:
          enum:
          - workspace
          - project
          - agent
          - run
        limits:
          type: object
          properties:
            max_tokens:
              type: integer
            max_cost_usd:
              type: number
            max_duration_s:
              type: integer
            max_parallel_agents:
              type: integer
            max_tool_calls:
              type: integer
            max_recursion_depth:
              type: integer
            max_retries:
              type: integer
        alerts:
          type: array
          items:
            type: integer
    User:
      type: object
      required:
      - id
      - email
      - name
      - status
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        status:
          enum:
          - active
          - suspended
          - invited
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
    Project:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
