name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB (single-node replica set)
        working-directory: .
        run: ./scripts/ci-mongo.sh
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check app tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: |
          key=$(./scripts/new-key.sh)
          # CI uses the bundled mongo service, never the Atlas cluster from .env.example.
          sed -e "s|^ENCRYPTION_KEYS=.*|ENCRYPTION_KEYS=$key|" \
              -e "s|^COMPOSE_MONGODB_URI=.*|COMPOSE_MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0|" .env.example > .env
          docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright journey
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
